<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 3</title>
    <script src = "Lessone3.js" defer></script>
</head>
<body>
    <h1>Welcome to Lesson 3</h1>
    <p>Lets learn tip-calculator!</p>
    <form id = "TipCalculator">
        <main>
            <div class = "Billcontainer">
                <p>Bill amount</p>
            <input
                type = "number"
                name = "billamount"
                id = "bill"
                placeholder="Billamount"
            >
            </div>
            <div class = "tip-container">
                <h3>Tip percentage <span id ="percentAmount">%</span></h3>
            <button 
                id = "button1" 
                name = "button"
                type = "button">5%
            </button>
              
               
            <button
                type = "button"
               name = "button"
               id = "button2">10%
            </button>
            <button
                type = "button"
               name = "button"
               id = "button3">15%
            </button>
            <button
                type = "button"
               name = "button"
               id = "button4">20%
            </button>
            </div>
            <div class = "people">
                <p>Number of people sharing</p>
            <input
                type = "number"
                name = "people"
                id = "numberOfpeople"
                placeholder = "people sharing"
                >
            </div>
            <div class = "Calculate">
                <button 
                id ="calculateBtn" 
                type="button">Calculate Tip
            </button>
            </div>
            <h3>Tip amount <span id = "tipAmount">?</span></h3>
            <h3>Total bill <span id = "totalAmount">?</span></h3>
            <h3>Each person <span id = "Persons">?</span></h3>

        </main>
    </form>
    <a href = "Lesson2.html" > <button>go back to lesson2</button></a>
    <a href = "Lesson4.html" > <button>go to lesson 4</button></a>

</body>
</html>
