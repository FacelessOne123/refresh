<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 7</title>
    <script src = "Lesson7.js" defer></script>
</head>
<body>
    <div class = "Guess">
        <h1>Welcome to Lesson7</h1>
        <h2>Number Guessing Game ./.</h2>

        <input
        type = "number"
        name = "numberIn"
        id="numberInput"
        min = "1" max="100"
        placeholder="Enter #"
        >
        
        <button id = "submitBtn">Submit</button>

        <p>HINT: <span id = "hintDisplay">----</p></p>
        <h2>Attempt: <span id = "attemptCounter">0</h2></p> 
        <button id = "restartBtn" type = "reset">Restart</button>
    </div>
</body>
</html>
